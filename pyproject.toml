[project]
name = "mymoney"
version = "0.1.0"
description = "MyMoney — Flet desktop client for income/expenses tracking"
requires-python = ">= 3.12"

[tool.ruff]
# Поддержка версии Python
target-version = "py312"

# Основные настройки
line-length = 120 # Максимальная длина строки для кода
indent-width = 4 # Ширина отступа

# Каталоги, которые следует учитывать при разрешении импорта из first/third-party источников
src = ["src"]

# Настройки линтера
[tool.ruff.lint]
# Нестабильные и находящиеся в предварительной версии правила
preview = true
# Правила, которые должен применять линтер
select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]
# Игнорирование конкретных предупреждений линтера (имена правил — требование RUF201)
ignore = [
    "unnecessary-collection-call",                # C408: Ненужный вызов dict, list и т.д.
    "ambiguous-unicode-character-string",         # RUF001: похожие символы с разными ASCII
    "ambiguous-unicode-character-docstring",      # RUF002
    "ambiguous-unicode-character-comment",        # RUF003
    "try-except-pass",                            # S110
    # Домен MyMoney намеренно работает с наивными локальными датами (сравнения с серверными данными, тесты)
    "call-datetime-without-tzinfo",               # DTZ001
    "call-datetime-now-without-tzinfo",           # DTZ005
    "call-date-today",                            # DTZ011
]
# Исключение директорий и файлов из линтинга
exclude = [
    "src/tests/**",
]
# Ошибки, которые могут быть исправлены автоматически
fixable = [
    "I", # cортировка испортов
]

[tool.ruff.lint.per-file-ignores]
# Офлайн-слой ловит любые ошибки сети, чтобы переключиться в offline-режим
"database/pending_store.py" = ["blind-except"]
"database/server_base.py" = ["blind-except"]
# В тестах допустимы assert и точное сравнение литеральных float-значений
"**/test/**" = ["assert", "float-equality-comparison"]
"**/test_*.py" = ["assert", "float-equality-comparison"]
# logging.basicConfig() должен выполняться до импорта application-модулей
"main.py" = ["module-import-not-at-top-of-file"]
# QA-скрипт намеренно печатает отчёт (ошибки снимков гасятся ruff: ignore)
"tools/screenshots.py" = ["T20"]

# Дополнительные настройки для плагинов
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # Проверка типизированных исключений

# Настройки форматтера
[tool.ruff.format]
quote-style = "double" # 'single' для одинарных, "double" для двойных кавычек
indent-style = "space"
